name: Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: "Deploy infrastructure (OpenTofu)"
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy Worker + Web"
        type: boolean
        default: true

jobs:
  deploy-infra:
    name: OpenTofu apply
    if: ${{ inputs.deploy_infra }}
    runs-on: ubuntu-latest
    outputs:
      kv_namespace_id: ${{ steps.output.outputs.kv_namespace_id }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_stats_cc_api_key: ${{ secrets.STATS_CC_API_KEY }}
      TF_VAR_r6data_api_key: ${{ secrets.R6DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: OpenTofu init
        working-directory: infra
        run: tofu init

      - name: OpenTofu apply
        working-directory: infra
        run: tofu apply -auto-approve

      - name: Get outputs
        id: output
        working-directory: infra
        run: echo "kv_namespace_id=$(tofu output -raw kv_namespace_id)" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy Worker
    needs: deploy-infra
    if: ${{ always() && inputs.deploy_worker && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (outputs to apps/api/public)
        run: bun run build --filter=@r6fetch/web

      - name: Get KV namespace ID
        id: kv
        run: |
          if [ -n "${{ needs.deploy-infra.outputs.kv_namespace_id }}" ]; then
            echo "id=${{ needs.deploy-infra.outputs.kv_namespace_id }}" >> "$GITHUB_OUTPUT"
          else
            # Fetch from Cloudflare API if infra was skipped
            KV_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces?per_page=100" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" | jq -r '.result[] | select(.title=="r6fetch-cache") | .id')
            echo "id=$KV_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        working-directory: apps/api
        run: |
          sed -i 's/PLACEHOLDER_KV_ID/${{ steps.kv.outputs.id }}/g' wrangler.toml
          bunx wrangler deploy
