name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Detect which paths changed ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
            api:
              - 'apps/api/**'
              - 'packages/**'
            web:
              - 'apps/web/**'
              - 'packages/**'

  # ── OpenTofu apply (infra changes only) ────────────────────────────────────
  deploy-infra:
    name: OpenTofu apply
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    outputs:
      kv_namespace_id: ${{ steps.output.outputs.kv_namespace_id }}
    env:
      # R2 backend credentials (S3-compatible)
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      # Terraform variables
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_r6data_api_key: ${{ secrets.R6DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: OpenTofu init
        working-directory: infra
        run: tofu init

      - name: OpenTofu apply
        working-directory: infra
        run: tofu apply -auto-approve

      - name: Get outputs
        id: output
        working-directory: infra
        run: echo "kv_namespace_id=$(tofu output -raw kv_namespace_id)" >> "$GITHUB_OUTPUT"

  # ── Build web → api/public, then deploy Worker ───────────────────────────────
  deploy-api:
    name: Deploy Worker
    needs: [changes, deploy-infra]
    if: always() && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (outputs to apps/api/public)
        run: bun run build --filter=@r6fetch/web

      - name: Get KV namespace ID
        id: kv
        run: |
          if [ -n "${{ needs.deploy-infra.outputs.kv_namespace_id }}" ]; then
            echo "id=${{ needs.deploy-infra.outputs.kv_namespace_id }}" >> "$GITHUB_OUTPUT"
          else
            # Fetch from Cloudflare API if infra was skipped
            KV_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces?per_page=100" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" | jq -r '.result[] | select(.title=="r6fetch-cache") | .id')
            echo "id=$KV_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        working-directory: apps/api
        run: |
          sed -i 's/PLACEHOLDER_KV_ID/${{ steps.kv.outputs.id }}/g' wrangler.toml
          bunx wrangler deploy
