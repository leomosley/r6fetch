name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p r6-client -p renderer --all-targets -- -D warnings
      - run: cargo test -p r6-client -p renderer
      - run: cargo check -p r6-api --target wasm32-unknown-unknown
