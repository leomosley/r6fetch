name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_r6data_api_key: ${{ secrets.R6DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: infra
        run: terraform plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('infra/plan.txt', 'utf8')
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            })

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
