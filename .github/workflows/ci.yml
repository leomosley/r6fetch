name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  opentofu-plan:
    name: OpenTofu plan
    runs-on: ubuntu-latest
    # Only run on internal PRs (not forks) - secrets aren't available to forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    env:
      # R2 backend credentials (S3-compatible)
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_EC2_METADATA_DISABLED: true
      # Terraform variables
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_stats_cc_api_key: ${{ secrets.STATS_CC_API_KEY }}
      TF_VAR_r6data_api_key: ${{ secrets.R6DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - name: OpenTofu init
        working-directory: infra
        run: tofu init

      - name: OpenTofu plan
        id: plan
        working-directory: infra
        run: tofu plan -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('infra/plan.txt', 'utf8')
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### OpenTofu Plan\n\`\`\`\n${truncated}\n\`\`\``
            })

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
