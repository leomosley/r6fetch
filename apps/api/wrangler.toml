name = "r6fetch-api"
main = "src/index.ts"
compatibility_date = "2025-04-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability.logs]
enabled = true
invocation_logs = true

[[routes]]
pattern = "r6fetch.cc/*"
zone_name = "r6fetch.cc"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_KV_ID"
preview_id = "PLACEHOLDER_KV_PREVIEW_ID"

[vars]
CACHE_TTL_SECONDS = "300"
CACHE_ENABLED = "true"
DOMAIN = "r6fetch.cc"
# STATS_CC_API_KEY is stored as a Cloudflare Worker secret - never in wrangler.toml
# For local dev, set it in apps/api/.dev.vars (copy from .dev.vars.example)

[dev]
port = 8787
local_protocol = "http"
