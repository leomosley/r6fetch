name = "r6fetch-api"
main = "src/index.ts"
compatibility_date = "2025-04-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
run_worker_first = true

[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_KV_ID"
preview_id = "PLACEHOLDER_KV_PREVIEW_ID"

[vars]
CACHE_TTL_SECONDS = "300"
# R6DATA_API_KEY is stored as a Cloudflare Worker secret — never in wrangler.toml
